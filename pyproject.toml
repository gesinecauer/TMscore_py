[build-system]
requires = [
  "setuptools>=42",
  "wheel",
  "scikit-build",
  "cmake",
  "ninja; platform_system!='Windows'"
]
build-backend = "setuptools.build_meta"

[project]
name = "TMscore_py"
requires-python = ">= 3.6"
version = "0.0.1"
dependencies = [
  "numpy>=1.16.0",
]

readme = "README.md"
description = "Python wrapper for original TMscore C++ code"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Gesine Cauer"}]
maintainers = [{name = "Gesine Cauer"}]
classifiers=[
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"]

[project.urls]
Homepage = "https://github.com/gesinecauer/TMscore_py"
Repository = "https://github.com/gesinecauer/TMscore_py.git"
Issues = "https://github.com/gesinecauer/TMscore_py/issues"
Download = "https://github.com/gesinecauer/TMscore_py/releases"

[build-system]
requires = ["scikit-build-core"]
build-backend = "scikit_build_core.build"

[project]
name = "TMscore_py"
requires-python = ">= 3.6"
version = "0.0.1"
dependencies = [
  "numpy>=1.16.0",
]

readme = "README.md"
description = "Python wrapper for original TMscore C++ code"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Gesine Cauer"}]
maintainers = [{name = "Gesine Cauer"}]
classifiers=[
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "Operating System :: OS Independent"]

[project.urls]
Homepage = "https://github.com/gesinecauer/TMscore_py"
Repository = "https://github.com/gesinecauer/TMscore_py.git"
Issues = "https://github.com/gesinecauer/TMscore_py/issues"
Download = "https://github.com/gesinecauer/TMscore_py/releases"

[tool.scikit-build]
cmake.args = ["-DCMAKE_CXX_FLAGS='-O3 -ffast-math -lm'"]

